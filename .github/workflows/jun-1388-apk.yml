name: JUN-1388 Awai account Android APK
on:
  push:
    branches: [codex/jun-1388-host-account-apk-ci]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ITO_COMMIT: e2686959a71ced5895e5dc95c438e4b8e43baa79
      AGE_RECIPIENT: age1farsf606mcz7vcynzghcvtg0vlpvl5vkuy4vgpqpw2jqr83085ws3mnx4x
    steps:
      - name: Check out exact PR source
        shell: bash
        run: |
          git init source
          git -C source remote add origin https://github.com/network-awai/awai-os.git
          git -C source fetch --depth=1 origin "$ITO_COMMIT"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$ITO_COMMIT"
          test -z "$(git -C source status --porcelain)"
      - name: Install pinned build prerequisites
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          node --version
          rustup target add aarch64-linux-android
          curl -fsSL --retry 4 https://download.clojure.org/install/linux-install-1.12.0.1530.sh -o "$RUNNER_TEMP/clojure-install.sh"
          bash "$RUNNER_TEMP/clojure-install.sh" --prefix "$RUNNER_TEMP/clojure"
          curl -fsSL --retry 4 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          printf '%s  %s\n' e025545c62a8e64c7559119566a569fb1dec5f60 "$RUNNER_TEMP/android-tools.zip" | sha1sum -c -
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          manager="$RUNNER_TEMP/android-tools/cmdline-tools/bin/sdkmanager"
          (
            set +o pipefail
            yes | "$manager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          )
          "$manager" --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'ndk;27.0.12077973' 'build-tools;36.1.0'
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/clojure/bin" "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          if ! command -v age >/dev/null; then
            sudo apt-get install -y --no-install-recommends age
          fi
          df -h .
      - name: Build Murakumo arm64 and check native engines
        shell: bash
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$ITO_COMMIT"
          # Adjust build-tool host paths from the macOS defaults.
          sed -i 's/darwin-x86_64/linux-x86_64/g' apps/murakumo/scripts/{build-native,build-image-native}.py
          python3 apps/murakumo/scripts/build-native.py arm64-v8a
          python3 apps/murakumo/scripts/build-image-native.py arm64-v8a
          npm --prefix packages/awai-ui ci --no-audit --no-fund
          npm --prefix packages/awai-ui run build
          npm --prefix otehon/shell ci --no-audit --no-fund
          npm --prefix apps/murakumo ci --no-audit --no-fund
          npm --prefix apps/murakumo run build
          npm --prefix apps/murakumo test
          npm --prefix apps/murakumo run tauri -- android build --apk --target aarch64 --debug
      - name: Verify and encrypt APK
        shell: bash
        working-directory: source
        run: |
          mapfile -t apks < <(find apps/murakumo/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$apk" | grep -F "package: name='network.awai.murakumo'"
          for lib in libawai_llama.so libawai_diffusion.so; do
            unzip -p "$apk" "lib/arm64-v8a/$lib" | sha256sum
          done
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify "$apk"
          cp "$apk" "$RUNNER_TEMP/murakumo-arm64-debug.apk"
          cp .agent-output/image-native-arm64-v8a.json "$RUNNER_TEMP/image-native.json"
          printf '%s\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/source.txt"
          (cd "$RUNNER_TEMP" && sha256sum murakumo-arm64-debug.apk > sha256.txt)
          mkdir -p "$GITHUB_WORKSPACE/encrypted"
          tar -C "$RUNNER_TEMP" -cf - murakumo-arm64-debug.apk image-native.json source.txt sha256.txt |
            age --recipient "$AGE_RECIPIENT" --output "$GITHUB_WORKSPACE/encrypted/murakumo-arm64-debug.tar.age"
      - name: Upload encrypted APK only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jun-1388-encrypted-murakumo-apk
          path: encrypted/murakumo-arm64-debug.tar.age
          if-no-files-found: error
          retention-days: 1
